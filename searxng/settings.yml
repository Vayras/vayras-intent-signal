use_default_settings: true

general:
  instance_name: Intent Radar Search

server:
  secret_key: intent-radar-local-dev-key
  limiter: false
  image_proxy: false
  method: GET
  port: 8080
  bind_address: "0.0.0.0"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: en
  formats:
    - html
    - json

outgoing:
  request_timeout: 8.0

# Brave/DuckDuckGo/Google block scraping from datacenter IPs almost immediately.
# These are disabled by default but not yet blocked here; boardreader is a
# dedicated public-forum search engine.
engines:
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: qwant
    disabled: false
  - name: boardreader
    disabled: false
